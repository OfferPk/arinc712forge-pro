<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="30" y="25" width="940" height="70" rx="8" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="55" y="60" fill="#06b6d4" font-size="22" font-weight="800" letter-spacing="-0.5">ARINC 712 MARK 3 ADF RECEIVER SYSTEM ARCHITECTURE</text>
  <text x="55" y="80" fill="#94a3b8" font-size="12">Crossed-Loop &amp; Sense Antenna Cardioid Resolver, LF/MF Tuning (190–1750 kHz), BFO Tone &amp; ARINC 429 Bus</text>

  <!-- Left: Antenna Subsystem & Goniometer -->
  <rect x="30" y="115" width="280" height="495" rx="8" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="115" width="280" height="38" rx="8" fill="#1e293b"/>
  <text x="50" y="140" fill="#f8fafc" font-size="14" font-weight="700">ANTENNA &amp; GONIOMETER</text>

  <!-- Crossed-Loop Antenna -->
  <rect x="50" y="170" width="240" height="90" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="195" fill="#38bdf8" font-size="12" font-weight="700">Fixed Crossed-Loop Array</text>
  <text x="65" y="215" fill="#94a3b8" font-size="11">• Loop X (Fore-Aft): Vx = cos(θ)</text>
  <text x="65" y="235" fill="#94a3b8" font-size="11">• Loop Y (Athwart): Vy = sin(θ)</text>
  <text x="65" y="250" fill="#34d399" font-size="10">Orthogonal Bidirectional Figure-Eight</text>

  <!-- Sense Antenna -->
  <rect x="50" y="275" width="240" height="90" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="300" fill="#34d399" font-size="12" font-weight="700">Omnidirectional Sense Antenna</text>
  <text x="65" y="320" fill="#94a3b8" font-size="11">• Monopole Circular Reception: Vs = 1.0</text>
  <text x="65" y="340" fill="#94a3b8" font-size="11">• 90° Quadrature Phase Shifter</text>
  <text x="65" y="355" fill="#38bdf8" font-size="10">Eliminates 180° Quadrant Ambiguity</text>

  <!-- Cardioid Null Resolver -->
  <rect x="50" y="380" width="240" height="90" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="405" fill="#fbbf24" font-size="12" font-weight="700">Cardioid Null Detector</text>
  <text x="65" y="425" fill="#94a3b8" font-size="11">• Pattern Math: R = 1 - cos(θ)</text>
  <text x="65" y="445" fill="#94a3b8" font-size="11">• Digital Goniometer Motor Tracking</text>
  <text x="65" y="460" fill="#94a3b8" font-size="10">Sharp Unambiguous Zero-Signal Null</text>

  <!-- BFO Subsystem -->
  <rect x="50" y="485" width="240" height="105" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="65" y="510" fill="#c084fc" font-size="12" font-weight="700">Beat Frequency Oscillator (BFO)</text>
  <text x="65" y="530" fill="#94a3b8" font-size="11">• 1020 Hz Local Injection Oscillator</text>
  <text x="65" y="550" fill="#94a3b8" font-size="11">• A1A / NON Unmodulated Carrier Ident</text>
  <text x="65" y="570" fill="#34d399" font-size="10">• e.g. "DXB" (-.. -..- -...) Demodulated</text>

  <!-- Middle: Dual ADF Receiver Core LRUs -->
  <rect x="340" y="115" width="320" height="495" rx="8" fill="url(#grad-card)" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="115" width="320" height="38" rx="8" fill="#0891b2"/>
  <text x="360" y="140" fill="#ffffff" font-size="14" font-weight="800">MARK 3 ADF RECEIVER (4-MCU)</text>

  <rect x="360" y="170" width="280" height="130" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="195" fill="#10b981" font-size="13" font-weight="700">ADF 1 RECEIVER (CAPTAIN)</text>
  <text x="375" y="215" fill="#cbd5e1" font-size="11">• Primary Low/Med Frequency Tuner</text>
  <text x="375" y="235" fill="#cbd5e1" font-size="11">• 190.0–1750.0 kHz Continuous Band</text>
  <text x="375" y="255" fill="#cbd5e1" font-size="11">• 13-bit BNR Bearing Output (0.04395°/LSB)</text>
  <text x="375" y="280" fill="#10b981" font-size="11" font-weight="600">STATUS: ACTIVE TRACK (SDI 1 / BUS A)</text>

  <rect x="360" y="315" width="280" height="130" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="375" y="340" fill="#94a3b8" font-size="13" font-weight="700">ADF 2 RECEIVER (FIRST OFFICER)</text>
  <text x="375" y="360" fill="#94a3b8" font-size="11">• Dual-Redundant Standby/Co-Pilot Unit</text>
  <text x="375" y="380" fill="#94a3b8" font-size="11">• Cross-Talk Bus Heartbeat &amp; BITE Check</text>
  <text x="375" y="400" fill="#94a3b8" font-size="11">• Cross-Bearing Dual-Pointer RMI Channel</text>
  <text x="375" y="425" fill="#f59e0b" font-size="11" font-weight="600">STATUS: HOT STANDBY (SDI 2 / BUS B)</text>

  <!-- Heading Integration -->
  <rect x="360" y="460" width="280" height="130" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="375" y="485" fill="#06b6d4" font-size="12" font-weight="700">Heading &amp; Bearing Resolver</text>
  <text x="375" y="505" fill="#94a3b8" font-size="11">• Ingests ADIRU Label 320 Magnetic Heading</text>
  <text x="375" y="525" fill="#94a3b8" font-size="11">• Math: MB = (Relative Bearing + HDG) % 360</text>
  <text x="375" y="545" fill="#94a3b8" font-size="11">• Automatic QDM / QDR Reciprocal Output</text>
  <text x="375" y="570" fill="#34d399" font-size="11" font-weight="600">RTCA DO-179 / TSO-C41d COMPLIANT</text>

  <!-- Right: ARINC 429 Digital Bus Words & Cockpit Display -->
  <rect x="690" y="115" width="280" height="495" rx="8" fill="url(#grad-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="690" y="115" width="280" height="38" rx="8" fill="#1e293b"/>
  <text x="710" y="140" fill="#f8fafc" font-size="14" font-weight="700">ARINC 429 BUS WORDS</text>

  <!-- Word List -->
  <rect x="710" y="170" width="240" height="230" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="725" y="195" fill="#34d399" font-size="12" font-weight="700">Avionics Bus Word Outputs</text>
  <text x="725" y="215" fill="#94a3b8" font-size="11">• Label 032: Tuning Frequency (BCD)</text>
  <text x="725" y="235" fill="#94a3b8" font-size="11">• Label 162: Relative Bearing (BNR)</text>
  <text x="725" y="255" fill="#94a3b8" font-size="11">• Label 270: ADF Status &amp; Mode Word</text>
  <text x="725" y="275" fill="#94a3b8" font-size="11">• Label 350: Maintenance BITE Word</text>
  <text x="725" y="300" fill="#06b6d4" font-size="11" font-weight="700">Bit 32 Odd Parity: Strictly Enforced</text>
  <text x="725" y="320" fill="#38bdf8" font-size="10">Resolution: 13 bits (0.04395°/LSB)</text>
  <text x="725" y="340" fill="#34d399" font-size="10">ANT Mode: Automatic NCD SSM Report</text>
  <text x="725" y="360" fill="#fbbf24" font-size="10">Loop Test Mode: Recentering Verified</text>
  <text x="725" y="380" fill="#10b981" font-size="11" font-weight="700">ARINC 712 CERTIFIED</text>

  <!-- Cockpit Integration Targets -->
  <rect x="710" y="415" width="240" height="175" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="725" y="440" fill="#38bdf8" font-size="12" font-weight="700">Cockpit &amp; Instrument Integration</text>
  <text x="725" y="460" fill="#94a3b8" font-size="11">• Radio Magnetic Indicator (RMI) Pointer</text>
  <text x="725" y="480" fill="#94a3b8" font-size="11">• Navigation Display (ND) ADF Pointer 1/2</text>
  <text x="725" y="500" fill="#94a3b8" font-size="11">• Primary Flight Display (PFD) Bearing Arrow</text>
  <text x="725" y="520" fill="#94a3b8" font-size="11">• Flight Management System (FMS) Sensors</text>
  <text x="725" y="540" fill="#34d399" font-size="10">Non-GNSS Oceanic &amp; Remote Tracking</text>
  <text x="725" y="565" fill="#10b981" font-size="11" font-weight="700">TSO-C41d / DO-179 PASS</text>
</svg>